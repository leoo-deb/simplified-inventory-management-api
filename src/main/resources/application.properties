spring.application.name=estoque-api

# Database Config
spring.datasource.url=jdbc:postgresql://localhost:5432/simple_invetory
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA Config
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Config
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# H2 Config
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson Config
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-ignored-properties=true

spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=4MB

# Storage
storage.secret.key=${STORAGE_SECRET_KEY}
storage.access.key=${STORAGE_ACCESS_ID}
storage.bucket-name=${STORAGE_BUCKET_NAME}
storage.region=${STORAGE_REGION}
storage.public-url=${STORAGE_PUBLIC_URL}

# Swagger OpenApi
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# JWT & Security
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}

#Front & Origins
app.cors.allowed-origins=${ALLOWED_ORIGINS}

